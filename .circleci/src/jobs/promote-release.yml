docker:
  - image: cimg/node:lts
steps:
  - checkout
  - attach_workspace:
      at: .
  - run:
      name: Install app-toolbelt
      command: npm ci
  - run:
      name: Promote pre-release to latest
      command: |
        npx --no app-toolbelt v0 release promote \
          --platform all \
          --private-key "${DELIVERINO_PRIVATE_KEY}" \
          --owner "${CIRCLE_PROJECT_USERNAME}" \
          --repo "${CIRCLE_PROJECT_REPONAME}"
  - run:
      name: Read version
      command: echo "export NEW_VERSION=$(jq -r .versionName version.json)" >> ${BASH_ENV}
  - notify:
      success_message: '[Production] Lunes CMS ${NEW_VERSION} has been promoted successfully to production! :tada:\nIt goes live on lunes-prod with the next highstate – please run it to complete the release.'
      channel: releases
      allow_all_branches: true
