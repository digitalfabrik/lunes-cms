executor: python
environment:
  LLM_REVIEW_PR_NUMBER: << pipeline.parameters.llm_review_pr_number >>
steps:
  - checkout
  - run:
      name: Install python dependencies
      # Pinned to the versions pyproject.toml declares; bump them together.
      command: pip install --user --no-cache-dir "PyJWT[crypto]==2.13.0" "requests==2.34.2"
  - run:
      name: Request Deliverino installation access token
      command: |
        TOKEN=$(./.circleci/scripts/get_access_token.py)
        echo "export DELIVERINO_ACCESS_TOKEN=$TOKEN" >> $BASH_ENV
  - run:
      name: Run LLM PR review
      command: python .circleci/scripts/llm-pr-review.py
  - notify
