commands:
    activate-venv:
        steps:
            - run:
                command: echo "source .venv/bin/activate" >> $BASH_ENV
                name: Activate virtual environment
    configure-deliverino:
        steps:
            - run:
                command: |
                    TOKEN=$(./.circleci/scripts/get_access_token.py)
                    echo "export DELIVERINO_ACCESS_TOKEN=$TOKEN" >> $BASH_ENV
                name: Request installation access token to authorize as Deliverino app
            - run:
                command: |
                    git config user.name "deliverino[bot]"
                    git config user.email "62934656+deliverino[bot]@users.noreply.github.com"
                    git remote set-url origin "https://x-access-token:${DELIVERINO_ACCESS_TOKEN}@github.com/digitalfabrik/lunes-cms.git"
                name: Configure git to commit & push as Deliverino app
    install-uv:
        steps:
            - run:
                command: pip install uv==0.11.31
                name: Install uv
    notify:
        description: Send a notification (to Mattermost) at the end of a job, based on success or failure. Must be the last step in a job.
        parameters:
            allow_all_branches:
                default: false
                type: boolean
            channel:
                default: lunes-app-notifications
                type: string
            failure_mentions:
                default: '@leandra.hahn @johannes.stock @sascha.beele @david.venhoff @andreas.fischer'
                type: string
            success_mentions:
                default: ""
                type: string
            success_message:
                default: ""
                type: string
        steps:
            - run:
                command: |
                    echo 'export MM_MESSAGE=":fire: [${CIRCLE_JOB}](${CIRCLE_BUILD_URL}) failed on branch ${CIRCLE_BRANCH}! :fire: << parameters.failure_mentions >>"' >> $BASH_ENV
                name: Mattermost - Prepare failure message
                when: on_fail
            - run:
                command: echo 'export MM_MESSAGE="<< parameters.success_message >>"' >> $BASH_ENV
                name: Mattermost - Prepare success message
                when: on_success
            - run:
                command: |
                    CHANNEL="<< parameters.channel >>"
                    ALLOW_ALL_BRANCHES=<< parameters.allow_all_branches >>

                    begins_with() { case $1 in "$2"*) true;; *) false;; esac; }

                    echo $MM_MESSAGE

                    if ! ($ALLOW_ALL_BRANCHES || [ "$CIRCLE_BRANCH" = "main" ] || begins_with $CIRCLE_BRANCH "release" || begins_with $CIRCLE_BRANCH "hotfix"); then
                      echo "Not on main or release branch. Skipping."
                      exit 0
                    fi

                    if [ -z "$MM_MESSAGE" ]; then
                      echo "No message set. Skipping."
                      exit 0
                    fi

                    if [ -z "${MM_WEBHOOK}" ]; then
                      echo "No mattermost webhook set. Skipping."
                      exit 0
                    fi

                    STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" -X POST -H 'Content-type: application/json' \
                      --data "{\"channel\": \"$CHANNEL\", \"username\": \"circleci\", \"text\": \"$MM_MESSAGE\"}" \
                      "${MM_WEBHOOK}")

                    if [ "$STATUS" -ne "200" ]; then
                      echo "Notification not sent. Status: $STATUS"
                      exit 1
                    fi

                    echo "Notification sent!"
                name: Mattermost Status Alert
                when: always
    persist-environment-variables:
        description: Save the environment variables exported so far into a file and persist it to the workspace, so downstream jobs in this workflow can restore them.
        steps:
            - run:
                command: |
                    cat ${BASH_ENV} >> environment_variables
                    cat environment_variables
                name: Save environment variables
            - persist_to_workspace:
                paths:
                    - environment_variables
                root: .
    restore-environment-variables:
        description: Restore environment variables persisted by bump-version. Must run after attach_workspace.
        steps:
            - run:
                command: |
                    touch environment_variables
                    cat environment_variables >> ${BASH_ENV}
                    cat environment_variables
                name: Restore environment variables
    sync-venv:
        description: |
            Create the venv from uv.lock if it wasn't restored from cache, then always refresh the project's own (editable) install. Must run after a restore_cache step targeting ".venv".
        steps:
            - run:
                command: |
                    if [[ -x ".venv/bin/python" ]]; then
                      echo "Virtual environment restored from cache, skipping dependency install"
                    else
                      rm -rf .venv
                      uv sync --extra dev --locked
                    fi
                    # The cache key only depends on uv.lock, so a restored .venv can be
                    # many commits/releases old. Always reinstall the project itself
                    # (cheap, no third-party deps to resolve) so lunes_cms.egg-info -
                    # and the version setuptools_scm derives from it - reflects the
                    # commit actually checked out here, not whatever commit populated
                    # the cache.
                    uv pip install --no-deps -e .
                name: Creating virtual environment
