{% extends 'admin/base.html' %}
{% block footer %}
    {% if not is_popup %}
        <footer class="main-footer p-2 {{ jazzmin_ui.footer_classes }}">
            <a href="https://www.tuerantuer.org/digitalfabrik" target="_blank">
                <strong>Tür an Tür Digitalfabrik gGmbH</strong>
            </a>
            {% include "admin/includes/legal_links.html" %}
            <span class="float-right">v{{ jazzmin_settings.site_version }}</span>
        </footer>
    {% endif %}
{% endblock %}
{% block extrajs %}
    <script>
        let unread_feedback_count = {{ unread_feedback_count }};
        let feedbackNavItem = $("#jazzy-sidebar a.nav-link[href$='/admin/cms/feedback/']");
        if (feedbackNavItem && unread_feedback_count > 0) {
            let counterSpan = $(document.createElement("span"));
            counterSpan.text(unread_feedback_count);
            counterSpan.addClass("position-absolute text-center rounded-circle bg-danger ml-2 px-1");
            counterSpan.css("min-width", "22.5px");
            feedbackNavItem.append(counterSpan);
            feedbackNavItem.find("p").width("auto");
        }

        let unread_feedbackv2_count = {{ unread_feedbackv2_count }};
        let feedbackv2NavItem = $("#jazzy-sidebar a.nav-link[href$='/admin/cmsv2/feedback/']");
        if (feedbackv2NavItem && unread_feedbackv2_count > 0) {
            let counterSpan = $(document.createElement("span"));
            counterSpan.text(unread_feedbackv2_count);
            counterSpan.addClass("position-absolute text-center rounded-circle bg-danger ml-2 px-1");
            counterSpan.css("min-width", "22.5px");
            feedbackv2NavItem.append(counterSpan);
            feedbackv2NavItem.find("p").width("auto");
        }

        let unread_notification_count = {{ unread_notification_count|default:0 }};
        let notificationNavItem = $("#jazzy-sidebar a.nav-link[href$='/admin/cmsv2/notification/']");
        if (notificationNavItem && unread_notification_count > 0) {
            let counterSpan = $(document.createElement("span"));
            counterSpan.text(unread_notification_count);
            counterSpan.addClass("position-absolute text-center rounded-circle bg-danger ml-2 px-1");
            counterSpan.css("min-width", "22.5px");
            notificationNavItem.append(counterSpan);
            notificationNavItem.find("p").width("auto");
        }
    </script>
{% endblock %}
